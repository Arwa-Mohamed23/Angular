<form class="row g-3" (submit)="onSubmit(customer.value)">
    <div class="col-12">
      <label for="inputTask" class="form-label">To do Form</label>
      <input type="text" class="form-control" id="inputTask" placeholder="Enter new task" #customer>
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-primary">Add</button>
    </div>
  </form>
