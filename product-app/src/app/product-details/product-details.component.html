<div class="container my-5 d-flex justify-content-center">
    <div class="card mb-3 shadow p-3 mb-5 bg-body-tertiary rounded" style="max-width: 540px;">
        <div class="row g-0">
            <div class="col-md-4">
                <img [src]="product.images[0]" class="img-fluid rounded-start" alt="product image">
            </div>
            <div class="col-md-8">
                <div class="card-body">
                    <h5 class="card-title">{{product.title}}</h5>
                    <p class="card-text">{{product.category}}</p>
                    <p class="card-text">{{product.brand}}</p>
                    <p class="card-text" [innerHTML]=" product.rating | starRating" style="color: goldenrod;"></p>
                    <p class="card-text">{{product.description}}</p>
                </div>
            </div>
        </div>
    </div>
</div>
